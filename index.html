<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BCT Card Generator - V4 Perfect Edition</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
:root {
  --crimson: #c8001a;
  --crimson-light: #ff1a35;
  --gold: #e8a000;
  --gold-bright: #ffbe2e;
  --bg-void: #050005;
  --bg-panel: #110010;
  --bg-surface: #180015;
  --border-dim: rgba(200,0,26,0.18);
  --border-mid: rgba(200,0,26,0.35);
  --text-primary: #ffffff;
  --text-secondary: rgba(255,255,255,0.65);
  --text-dim: rgba(255,255,255,0.35);
  --radius: 12px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background: var(--bg-void);
  background-image:
    radial-gradient(ellipse 100% 40% at 50% 0%, rgba(180,0,20,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 60% 30% at 80% 30%, rgba(100,0,80,0.08) 0%, transparent 60%);
  color: var(--text-primary);
  font-family: 'Exo 2', sans-serif;
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
.header {
  padding: 16px 16px 14px;
  background: linear-gradient(180deg, rgba(30,0,20,0.95) 0%, rgba(15,0,10,0.9) 100%);
  border-bottom: 1px solid var(--border-mid);
  position: relative;
}
.header::before {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background: linear-gradient(90deg, transparent, var(--crimson), var(--gold), var(--crimson), transparent);
}
.header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom: 8px; }
.header-badge {
  font-family: 'Rajdhani', sans-serif; font-size: 9px; font-weight: 700;
  letter-spacing: 3px; color: var(--gold); background: rgba(232,160,0,0.08);
  border: 1px solid rgba(232,160,0,0.25); padding: 3px 10px; border-radius: 3px;
}
.header-version { font-family: 'Rajdhani', sans-serif; font-size: 10px; font-weight: 600; color: var(--text-dim); }
.header-title { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 3px; line-height: 1; text-shadow: 0 0 30px rgba(200,0,26,0.5); }
.header-title em { font-style:normal; color: var(--gold-bright); }
.header-sub { font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 4px; color: var(--text-secondary); margin-top: 2px; }

/* ── CANVAS AREA ── */
.canvas-wrap { padding: 14px 14px 0; }
.canvas-outer {
  position: relative; border-radius: var(--radius); overflow: hidden;
  box-shadow: 0 0 0 1px rgba(200,0,26,0.5), 0 8px 40px rgba(0,0,0,0.9);
}
#mainCanvas {
  display:block; width:100%; height:auto; user-select:none; border-radius: var(--radius);
}
#mainCanvas.tool-paint { cursor: crosshair; }

/* ── DASHBOARD ── */
.dashboard { flex:1; padding: 14px; display:flex; flex-direction:column; gap: 14px; }
.sec-label {
  font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase;
  margin-bottom: 8px; display:flex; align-items:center; gap: 8px;
}
.sec-label::after { content:''; flex:1; height:1px; background: linear-gradient(90deg, var(--border-dim), transparent); }

/* Photos */
.upload-row { display:grid; grid-template-columns:1fr 1fr; gap: 10px; }
.upload-slot {
  background: var(--bg-surface); border: 1.5px dashed rgba(200,0,26,0.35);
  border-radius: var(--radius); cursor: pointer; position:relative; overflow:hidden;
  height: 90px; display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.upload-slot.loaded { border-style:solid; border-color: rgba(200,0,26,0.55); }
.slot-thumb { width:100%; height:100%; object-fit:cover; display:none; opacity:0.5; }
.upload-slot.loaded .slot-thumb { display:block; }
.slot-body { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.slot-name { font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-shadow:0 2px 4px #000; }
.upload-slot.loaded .slot-name { color: #fff; }

/* Tool Panel */
.tool-panel { background: var(--bg-panel); border: 1px solid var(--border-mid); border-radius: var(--radius); overflow:hidden; }
.tool-row { display:flex; border-bottom: 1px solid var(--border-dim); }
.tool-row:last-child { border-bottom:none; }

.tool-btn {
  flex:1; padding: 12px 6px; background:transparent; border:none; border-right: 1px solid var(--border-dim);
  color: var(--text-secondary); font-family: 'Rajdhani', sans-serif; font-size: 12px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase; cursor:pointer; display:flex; align-items:center; justify-content:center; gap: 4px;
}
.tool-btn:last-child { border-right:none; }
.tool-btn.active { color: var(--text-primary); background: rgba(200,0,26,0.15); }
.tool-btn.active-gold { color: var(--gold-bright); background: rgba(232,160,0,0.1); }

/* Settings Block */
.settings-block { display:none; padding:12px; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border-dim); flex-direction:column; gap:10px; }
.settings-block.open { display:flex; }

/* Inputs */
.input-group { display:flex; flex-direction:column; gap:4px; margin-bottom: 5px; }
.input-group label { font-family: 'Rajdhani', sans-serif; font-size: 10px; color: var(--text-dim); text-transform:uppercase; letter-spacing:1px; display:flex; justify-content:space-between;}
.input-box {
  width:100%; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1);
  border-radius:6px; color:#fff; font-family:'Exo 2', sans-serif; font-size:14px; font-weight:500; padding:10px;
  outline:none; transition:border 0.2s;
}
.input-box:focus { border-color:var(--crimson); background:rgba(200,0,26,0.05); }
select.input-box { cursor: pointer; color: var(--gold-bright); font-weight: 600; }
select.input-box option { background: #1a0015; color: #fff; }
textarea.input-box { resize:vertical; min-height:75px; }
.hl-yellow:focus { border-color:var(--gold); }
.hl-red:focus { border-color:var(--crimson-light); }

/* Buttons & Sliders */
.btn-download {
  width:100%; padding: 15px; background: linear-gradient(135deg, #a00015 0%, #cc001f 50%, #e0002a 100%);
  border:none; border-radius: var(--radius); color:#fff; font-family: 'Bebas Neue', sans-serif; font-size: 20px;
  letter-spacing: 3px; cursor:pointer; box-shadow: 0 4px 20px rgba(200,0,26,0.4); margin-top:10px;
}
.btn-download:active { transform:scale(0.98); }
.status { text-align:center; font-family: 'Rajdhani', sans-serif; font-size: 12px; font-weight: 600; color: var(--text-dim); padding: 5px; }

.mode-tabs { display:flex; gap:4px; margin-bottom:8px;}
.mode-tab { flex:1; padding:8px; background:rgba(255,255,255,0.05); border:none; border-radius:4px; color:var(--text-secondary); font-size:11px; font-weight:700; cursor:pointer;}
.mode-tab.sel { background:var(--crimson); color:#fff; }
input[type="file"] { display:none; }

/* Custom Sliders for Adjustments */
input[type=range].mini-range { flex:1; height:4px; -webkit-appearance:none; background:rgba(255,255,255,0.1); border-radius:2px; margin: 10px 0; }
input[type=range].mini-range::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--crimson-light); cursor:pointer; box-shadow: 0 0 5px rgba(255,0,0,0.5);}
</style>
</head>

<!-- HEADER -->
<div class="header">

<!-- DASHBOARD -->

  <!-- Tools Panel -->
  <div>
    <div class="sec-label">Card Settings</div>

        <button class="tool-btn" id="btnImage" onclick="setTool('image')">🖼 Adjust Image</button>
        <button class="tool-btn" id="btnPaint" onclick="setTool('paint')">🖌 Paint</button>
      </div>
      
      <!-- Text Panel -->
      <div class="settings-block open" id="textSettings">

          <label style="color:var(--gold-bright)">Select Violation Category</label>

            <option value="anti_islam_account">Anti-Islamic Account</option>
            <option value="anti_islam_page">Anti-Islamic Page</option>
            <option value="gambling_page">Gambling Page</option>
            <option value="gambling_account">Gambling Account</option>
            <option value="scammer_page">Scammer Page</option>
            <option value="scammer_account">Scammer Account</option>
          </select>
        </div>
        
        <div class="input-group">
          <label>Header Line (Top Badge)</label>

        </div>

        <div class="input-group">
          <label>Detailed Sub-Text (English Description)</label>
          <textarea id="mainText" class="input-box" placeholder="Description here..." oninput="renderFull()"></textarea>

        <div class="input-group">
          <label style="color:var(--gold-bright)">Highlight Text (Yellow) - Comma separated</label>
          <input type="text" id="hlText" class="input-box hl-yellow" placeholder="e.g. 136K followers" oninput="renderFull()">
        </div>
        <div class="input-group">
          <label style="color:var(--crimson-light)">Highlight Text (Red) - Comma separated</label>
          <input type="text" id="stText" class="input-box hl-red" placeholder="e.g. terminated" oninput="renderFull()">
        </div>
      </div>

      <!-- NEW: Image Adjustment Panel -->
      <div class="settings-block" id="imageSettings">
        <div class="mode-tabs">
          <button class="mode-tab sel" id="tabEv1" onclick="selectEv(1)">PHOTO 1</button>
          <button class="mode-tab" id="tabEv2" onclick="selectEv(2)">PHOTO 2</button>
        </div>
        <div style="font-size: 11px; color:var(--text-dim); text-align:center; margin-bottom: 5px;">
          Adjust zoom and move the picture to fit perfectly.
        </div>
        <div class="input-group">
          <label>Zoom In/Out <span id="valZoom">100%</span></label>
          <input type="range" class="mini-range" id="adjZoom" min="100" max="300" value="100" oninput="updateImageState()">
        </div>
        <div class="input-group">
          <label>Move Left ↔ Right (X-Axis)</label>
          <input type="range" class="mini-range" id="adjX" min="0" max="100" value="50" oninput="updateImageState()">
        </div>
        <div class="input-group">
          <label>Move Up ↕ Down (Y-Axis)</label>
          <input type="range" class="mini-range" id="adjY" min="0" max="100" value="50" oninput="updateImageState()">
        </div>
      </div>

      <!-- Paint Panel -->
      <div class="settings-block" id="paintSettings">
        <div class="mode-tabs">
          <button class="mode-tab sel" id="modeBlur" onclick="setPaintMode('blur')">BLUR</button>
          <button class="mode-tab" id="modeMosaic" onclick="setPaintMode('mosaic')">MOSAIC</button>
        </div>
        <div class="input-group" style="margin-bottom:10px;">
          <label>Brush Size</label>
          <input type="range" class="mini-range" id="brushSize" min="10" max="80" value="40">
        </div>
        <div style="display:flex; gap:10px;">
          <button class="mode-tab" onclick="undoPaint()" style="background:rgba(255,255,255,0.1)">↺ UNDO</button>
          <button class="mode-tab" onclick="clearPaint()" style="background:rgba(200,0,26,0.2); color:var(--crimson-light)">✖ CLEAR ALL</button>
        </div>
      </div>

      <div class="tool-row">
        <button class="tool-btn active-gold" id="logoBtn" onclick="toggleLogo()">🛡 Toggle Watermark</button>
      </div>

    </div>
  </div>

  <button class="btn-download" onclick="downloadCard()">DOWNLOAD CARD</button>
  <div class="status" id="status">Upload photos and select a category to start.</div>

</div>

<!-- Hidden Inputs -->
<input type="file" id="photo1In" accept="image/*" onchange="loadPhoto(this,1)">
<input type="file" id="photo2In" accept="image/*" onchange="loadPhoto(this,2)">

<script>
// ── Presets Database (Exact Matching English Format) ──
const textPresets = {
  obscene_account: {
    header: "OBSCENE ACCOUNT REMOVED",
    desc: "An Facebook account/page amassing 136K followers has been terminated for disseminating obscene and indecent content by Team BCT",
    yellow: "136K followers",
    red: "terminated"
  },
  obscene_page: {
    header: "OBSCENE PAGE REMOVED",
    desc: "An Facebook page amassing 250K followers has been terminated for disseminating obscene and indecent content by Team BCT",
    yellow: "250K followers",
    red: "terminated"
  },
  atheist_account: {
    header: "ATHEIST ACCOUNT REMOVED",
    desc: "A Facebook account amassing 50K followers has been terminated for spreading atheism and hurting religious sentiments by Team BCT",
    yellow: "50K followers",
    red: "terminated"
  },
  atheist_page: {
    header: "ATHEIST PAGE REMOVED",
    desc: "A Facebook page amassing 100K followers has been terminated for spreading atheism and hurting religious sentiments by Team BCT",
    yellow: "100K followers",
    red: "terminated"
  },
  anti_islam_account: {
    header: "ANTI-ISLAMIC ACCOUNT REMOVED",
    desc: "A Facebook account amassing 80K followers has been terminated for spreading hate speech and anti-Islamic propaganda by Team BCT",
    yellow: "80K followers",
    red: "terminated"
  },
  anti_islam_page: {
    header: "ANTI-ISLAMIC PAGE REMOVED",
    desc: "A Facebook page amassing 300K followers has been terminated for spreading hate speech and anti-Islamic propaganda by Team BCT",
    yellow: "300K followers",
    red: "terminated"
  },
  gambling_page: {
    header: "GAMBLING PAGE REMOVED",
    desc: "A Facebook page amassing 400K followers has been terminated for promoting illegal online gambling and betting by Team BCT",
    yellow: "400K followers",
    red: "terminated"
  },
  gambling_account: {
    header: "GAMBLING ACCOUNT REMOVED",
    desc: "A Facebook account amassing 60K followers has been terminated for promoting illegal online gambling and betting by Team BCT",
    yellow: "60K followers",
    red: "terminated"
  },
  scammer_page: {
    header: "SCAMMER PAGE REMOVED",
    desc: "A Facebook page amassing 150K followers has been terminated for scamming and fraudulent financial activities by Team BCT",
    yellow: "150K followers",
    red: "terminated"
  },
  scammer_account: {
    header: "SCAMMER ACCOUNT REMOVED",
    desc: "A Facebook account amassing 45K followers has been terminated for scamming and fraudulent financial activities by Team BCT",
    yellow: "45K followers",
    red: "terminated"
  }
};

// ── Core Setup ──
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const W = 1080, H = 1080;
canvas.width = W; canvas.height = H;

// Offscreen canvases
const baseCanvas = document.createElement('canvas'); baseCanvas.width = W; baseCanvas.height = H;
const bCtx = baseCanvas.getContext('2d', { willReadFrequently: true });

const paintCanvas = document.createElement('canvas'); paintCanvas.width = W; paintCanvas.height = H;
const pCtx = paintCanvas.getContext('2d');

// ── State ──
let logoImg = null;
let showLogo = true;
let activeTool = 'text';
let paintMode = 'blur';
let paintHistory = [];

let p1Img = null, p2Img = null;

// New: Image Adjustment States
let activeEv = 1;
// ox: 50 means centered (0 to 100 percentage of the extra overflowing area)
let pStates = [ { zoom: 100, ox: 50, oy: 50 }, { zoom: 100, ox: 50, oy: 50 } ];

const CARD_LAYOUT = {
  boxX: 160, boxY: 76, boxW: 760, boxH: 172, boxR: 30,
  badgeW: 500, badgeH: 60, badgeR: 16,
  photosY: 285, photosH: 745, photosW: 460, photosGap: 50       
};

document.fonts.ready.then(() => { onCategoryChange(); });

function onCategoryChange() {
  const cat = document.getElementById('categorySelect').value;
  if(textPresets[cat]) {
    document.getElementById('headerText').value = textPresets[cat].header;
    document.getElementById('mainText').value = textPresets[cat].desc;
    document.getElementById('hlText').value = textPresets[cat].yellow;
    document.getElementById('stText').value = textPresets[cat].red;
  }
  renderFull();
}

const logoTry = new Image();
logoTry.crossOrigin = 'anonymous';
logoTry.onload = () => { logoImg = logoTry; renderFull(); };
logoTry.src = 'https://i.ibb.co/Y72LMbdQ/20260502-163657.png';

// ── Photo Loading & Adjustment logic ──
function loadPhoto(input, n) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      if(n === 1) p1Img = img; else p2Img = img;
      
      // Reset position/zoom when new photo is uploaded
      pStates[n-1] = { zoom: 100, ox: 50, oy: 50 }; 
      
      document.getElementById('prev'+n).src = e.target.result;
      document.getElementById('slot'+n).classList.add('loaded');
      
      // Auto-switch to the adjustment tab
      selectEv(n);
      setTool('image'); 
      renderFull();
      msg('Photo ' + n + ' uploaded. Adjust Position and Zoom now.', 'ok');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function selectEv(n) {
  activeEv = n;
  document.getElementById('tabEv1').classList.toggle('sel', n === 1);
  document.getElementById('tabEv2').classList.toggle('sel', n === 2);
  const s = pStates[n-1];
  document.getElementById('adjZoom').value = s.zoom;
  document.getElementById('adjX').value = s.ox;
  document.getElementById('adjY').value = s.oy;
  document.getElementById('valZoom').innerText = s.zoom + '%';
}

function updateImageState() {
  const z = parseInt(document.getElementById('adjZoom').value);
  const x = parseInt(document.getElementById('adjX').value);
  const y = parseInt(document.getElementById('adjY').value);
  pStates[activeEv-1] = { zoom: z, ox: x, oy: y };
  document.getElementById('valZoom').innerText = z + '%';
  renderFull();
}


function roundPath(context, x, y, w, h, r) {
  context.beginPath();
  context.moveTo(x+r, y); context.lineTo(x+w-r, y);
  context.quadraticCurveTo(x+w, y, x+w, y+r); context.lineTo(x+w, y+h-r);
  context.quadraticCurveTo(x+w, y+h, x+w-r, y+h); context.lineTo(x+r, y+h);
  context.quadraticCurveTo(x, y+h, x, y+h-r); context.lineTo(x, y+r);
  context.quadraticCurveTo(x, y, x+r, y); context.closePath();
}

// ── Rendering Engine ──
function drawCardBackground() {
  bCtx.clearRect(0,0,W,H);

  let radGrad = bCtx.createRadialGradient(W/2, H/2, 50, W/2, H/2, 750);
  radGrad.addColorStop(0, '#190204'); radGrad.addColorStop(0.6, '#090001'); radGrad.addColorStop(1, '#020000');
  bCtx.fillStyle = radGrad; bCtx.fillRect(0,0,W,H);

  bCtx.save();
  roundPath(bCtx, CARD_LAYOUT.boxX, CARD_LAYOUT.boxY, CARD_LAYOUT.boxW, CARD_LAYOUT.boxH, CARD_LAYOUT.boxR);
  bCtx.lineWidth = 4; bCtx.strokeStyle = '#ff0000'; bCtx.fillStyle = 'rgba(15, 0, 2, 0.45)';
  bCtx.fill(); bCtx.stroke(); bCtx.restore();

  const badgeX = (W - CARD_LAYOUT.badgeW) / 2;
  const badgeY = CARD_LAYOUT.boxY - (CARD_LAYOUT.badgeH / 2);
  bCtx.save();
  roundPath(bCtx, badgeX, badgeY, CARD_LAYOUT.badgeW, CARD_LAYOUT.badgeH, CARD_LAYOUT.badgeR);
  bCtx.fillStyle = '#ff0000'; bCtx.shadowColor = 'rgba(255, 0, 0, 0.5)'; bCtx.shadowBlur = 10;
  bCtx.fill(); bCtx.restore();

  const frameX1 = (W - (CARD_LAYOUT.photosW * 2 + CARD_LAYOUT.photosGap)) / 2;
  const frameX2 = frameX1 + CARD_LAYOUT.photosW + CARD_LAYOUT.photosGap;

  const box1 = { x: frameX1, y: CARD_LAYOUT.photosY, w: CARD_LAYOUT.photosW, h: CARD_LAYOUT.photosH, r: 24 };
  const box2 = { x: frameX2, y: CARD_LAYOUT.photosY, w: CARD_LAYOUT.photosW, h: CARD_LAYOUT.photosH, r: 24 };

  // Render the Photo slots with Pan & Zoom functionality applied
  [ {img:p1Img, b:box1, s:pStates[0]}, {img:p2Img, b:box2, s:pStates[1]} ].forEach((slot, idx) => {
    bCtx.save();
    roundPath(bCtx, slot.b.x, slot.b.y, slot.b.w, slot.b.h, slot.b.r);
    
    if(slot.img) {
      bCtx.save();
      bCtx.clip();
      bCtx.imageSmoothingEnabled = true;
      bCtx.imageSmoothingQuality = 'high';
      
      // Calculate how much to scale based on base frame and user slider
      const baseScale = Math.max(slot.b.w / slot.img.width, slot.b.h / slot.img.height);
      const finalScale = baseScale * (slot.s.zoom / 100);
      
      const w = slot.img.width * finalScale;
      const h = slot.img.height * finalScale;
      
      // Calculate overflow boundaries
      const extraW = w - slot.b.w;
      const extraH = h - slot.b.h;
      
      // Apply offset percentages to move within boundaries
      const dx = slot.b.x - (extraW * (slot.s.ox / 100));
      const dy = slot.b.y - (extraH * (slot.s.oy / 100));
      
      bCtx.drawImage(slot.img, dx, dy, w, h);
      bCtx.restore();

      bCtx.lineWidth = 6;
      bCtx.strokeStyle = '#ff0000';
      bCtx.stroke();
    } else {
      bCtx.fillStyle = 'rgba(255,255,255,0.01)';
      bCtx.fill();
      bCtx.lineWidth = 3;
      bCtx.strokeStyle = 'rgba(255, 0, 0, 0.25)';
      bCtx.stroke();

      bCtx.fillStyle = 'rgba(255,255,255,0.12)';
      bCtx.font = "bold 18px 'Rajdhani', sans-serif";
      bCtx.textAlign = 'center';
      bCtx.fillText(`UPLOAD PHOTO ${idx + 1}`, slot.b.x + slot.b.w/2, slot.b.y + slot.b.h/2);
    }
    bCtx.restore();
  });
}

function renderFull() {
  drawCardBackground();

  ctx.clearRect(0,0,W,H);
  ctx.drawImage(baseCanvas, 0, 0);
  ctx.drawImage(paintCanvas, 0, 0); 

  const headerRaw = document.getElementById('headerText').value.trim();
  if(headerRaw) {
    ctx.save();
    ctx.font = "800 32px 'Rajdhani', sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.letterSpacing = "2px";
    ctx.fillText(headerRaw.toUpperCase(), W/2, CARD_LAYOUT.boxY); 
    ctx.restore();
  }

  drawFixedParagraph();
  
  if(showLogo && logoImg) {
    ctx.save();
    ctx.globalAlpha = 0.12;
    const ls = 360;
    const logoY = CARD_LAYOUT.photosY + (CARD_LAYOUT.photosH / 2) - (ls / 2);
    ctx.drawImage(logoImg, (W-ls)/2, logoY, ls, ls);
    ctx.restore();
  }
}

function drawFixedParagraph() {
  const textRaw = document.getElementById('mainText').value.trim();
  if(!textRaw) return;

  const hwList = document.getElementById('hlText').value.split(',').map(s=>s.trim()).filter(s=>s);
  const swList = document.getElementById('stText').value.split(',').map(s=>s.trim()).filter(s=>s);

  let segments = [{ text: textRaw, style: 'normal' }];
  
  function applyStyle(list, styleName) {
    list.forEach(word => {
      if(!word) return;
      let nextSegs = [];
      segments.forEach(seg => {
        if(seg.style !== 'normal') { nextSegs.push(seg); return; }
        let parts = seg.text.split(word);
        for(let i=0; i<parts.length; i++) {
          if(parts[i]) nextSegs.push({ text: parts[i], style: 'normal' });
          if(i < parts.length - 1) nextSegs.push({ text: word, style: styleName });
        }
      });
      segments = nextSegs;
    });
  }
  
  applyStyle(hwList, 'highlight'); applyStyle(swList, 'redtext');

  let tokens = [];
  segments.forEach(seg => {
    let regex = /(\s+|\S+)/g;
    let match;
    while ((match = regex.exec(seg.text)) !== null) {
      if(match[0].length > 0) tokens.push({ text: match[0], style: seg.style, isSpace: /^\s+$/.test(match[0]) });
    }
  });

  ctx.save();
  
  let fontSize = 34;
  let lineHeight = 44;
  let lines = [];
  const maxAllowW = CARD_LAYOUT.boxW - 60; 
  const maxAllowH = CARD_LAYOUT.boxH - 60; 

  while (fontSize > 16) {
    ctx.font = `500 ${fontSize}px 'Exo 2', sans-serif`;
    lines = [];
    let currentLine = [], currentW = 0;

    for (let i = 0; i < tokens.length; i++) {
      let tok = tokens[i];
      if(tok.text.includes('\n')) {
        lines.push({ words: currentLine, w: currentW });
        currentLine = []; currentW = 0; continue;
      }
      let tw = ctx.measureText(tok.text).width;
      if(!tok.isSpace && currentW + tw > maxAllowW && currentLine.length > 0) {
        if(currentLine[currentLine.length-1].isSpace) { currentW -= currentLine[currentLine.length-1].w; currentLine.pop(); }
        lines.push({ words: currentLine, w: currentW });
        currentLine = []; currentW = 0;
      }
      currentLine.push({ ...tok, w: tw });
      currentW += tw;
    }
    if(currentLine.length > 0) {
      if(currentLine[currentLine.length-1].isSpace) { currentW -= currentLine[currentLine.length-1].w; currentLine.pop(); }
      lines.push({ words: currentLine, w: currentW });
    }

    if (lines.length * lineHeight <= maxAllowH) break; 
    fontSize -= 2; lineHeight -= 2.5;
  }

  const totalH = lines.length * lineHeight;
  let startY = CARD_LAYOUT.boxY + (CARD_LAYOUT.boxH / 2) - (totalH / 2) + (lineHeight / 2) + 12; 
  ctx.textBaseline = 'middle';

  lines.forEach((line, i) => {
    let x = (W - line.w) / 2;
    let y = startY + i * lineHeight;

    line.words.forEach(item => {
      ctx.fillStyle = '#ffffff';
      if(item.style === 'highlight') ctx.fillStyle = '#ffbe2e'; 
      else if (item.style === 'redtext') ctx.fillStyle = '#ff1a35'; 
      ctx.fillText(item.text, x, y);
      x += item.w;
    });
  });

  ctx.restore();
}

// ── UI Control Systems ──
function toggleLogo() {
  showLogo = !showLogo;
  document.getElementById('logoBtn').classList.toggle('active-gold', showLogo);
  renderFull();
}

function setTool(tool) {
  activeTool = tool;
  document.getElementById('btnText').classList.toggle('active', tool==='text');
  document.getElementById('btnImage').classList.toggle('active', tool==='image');
  document.getElementById('btnPaint').classList.toggle('active', tool==='paint');
  
  canvas.className = tool === 'paint' ? 'tool-paint' : '';
  
  document.getElementById('textSettings').classList.toggle('open', tool==='text');
  document.getElementById('imageSettings').classList.toggle('open', tool==='image');
  document.getElementById('paintSettings').classList.toggle('open', tool==='paint');
}

function setPaintMode(m) {
  paintMode = m;
  document.getElementById('modeBlur').classList.toggle('sel', m==='blur');
  document.getElementById('modeMosaic').classList.toggle('sel', m==='mosaic');
}

// ── Privacy Brush Paint Engine ──
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };
}

let painting = false;

canvas.addEventListener('mousedown', handleStart); canvas.addEventListener('touchstart', handleStart, {passive:false});
canvas.addEventListener('mousemove', handleMove); canvas.addEventListener('touchmove', handleMove, {passive:false});
canvas.addEventListener('mouseup', handleEnd); canvas.addEventListener('touchend', handleEnd);

function handleStart(e) {
  if(activeTool !== 'paint') return;
  if(e.cancelable) e.preventDefault();
  painting = true; savePaintHistory();
  const {x, y} = getPos(e); doPaint(x, y);
}
function handleMove(e) {
  if(!painting || activeTool !== 'paint') return;
  if(e.cancelable) e.preventDefault();
  const {x, y} = getPos(e); doPaint(x, y);
}
function handleEnd() { painting = false; }

function doPaint(cx, cy) {
  const r = parseInt(document.getElementById('brushSize').value);
  const sampleCanvas = document.createElement('canvas'); sampleCanvas.width = W; sampleCanvas.height = H;
  const sCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
  sCtx.drawImage(baseCanvas, 0, 0); sCtx.drawImage(paintCanvas, 0, 0);

  const x1 = Math.max(0, cx-r|0), y1 = Math.max(0, cy-r|0);
  const x2 = Math.min(W, cx+r|0), y2 = Math.min(H, cy+r|0);
  const w = x2-x1, h = y2-y1;
  if(w<=0 || h<=0) return;

  if(paintMode === 'blur') {
    const patch = document.createElement('canvas'); patch.width = w; patch.height = h;
    const ptCtx = patch.getContext('2d');
    ptCtx.filter = `blur(${Math.round(r*0.25)}px)`;
    ptCtx.drawImage(sampleCanvas, x1, y1, w, h, 0, 0, w, h);
    pCtx.save(); pCtx.beginPath(); pCtx.arc(cx, cy, r, 0, Math.PI*2); pCtx.clip();
    pCtx.drawImage(patch, x1, y1); pCtx.restore();
  } else {
    const block = Math.max(8, Math.round(r*0.35));
    pCtx.save(); pCtx.beginPath(); pCtx.arc(cx, cy, r, 0, Math.PI*2); pCtx.clip();
    for(let bx=x1; bx<x2; bx+=block) {
      for(let by=y1; by<y2; by+=block) {
        const bw = Math.min(block, x2-bx), bh = Math.min(block, y2-by);
        const imgData = sCtx.getImageData(bx, by, bw, bh).data;
        let rr=0, gg=0, bb=0, count=0;
        for(let i=0; i<imgData.length; i+=4) { rr+=imgData[i]; gg+=imgData[i+1]; bb+=imgData[i+2]; count++; }
        if(count>0) { pCtx.fillStyle = `rgb(${rr/count},${gg/count},${bb/count})`; pCtx.fillRect(bx, by, bw+1, bh+1); }
      }
    }
    pCtx.restore();
  }
  renderFull();
}

function savePaintHistory() {
  paintHistory.push(pCtx.getImageData(0,0,W,H));
  if(paintHistory.length > 10) paintHistory.shift();
}
function undoPaint() {
  if(!paintHistory.length) return;
  pCtx.putImageData(paintHistory.pop(), 0, 0); renderFull();
}
function clearPaint() { pCtx.clearRect(0,0,W,H); paintHistory = []; renderFull(); }

function downloadCard() {
  if(!p1Img && !p2Img) { msg('Please upload at least one photo.', 'err'); return; }
  const a = document.createElement('a');
  a.download = 'BCT_V4_Perfect_' + Date.now() + '.jpg';
  
  // Bug fix: Fixed the typo `toToDataURL` to `toDataURL`
  a.href = canvas.toDataURL('image/jpeg', 0.95);
  a.click();
  msg('Card downloaded successfully!', 'ok');
}

function msg(text) { document.getElementById('status').textContent = text; }
</script>
